name: Keep Guardian Verifier Awake

on:
  schedule:
    - cron: '0 */4 * * *'  # UTC, KST 오후 1시/5시/9시/1시 등
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Selenium
        run: pip install selenium
      - name: Wake app with Selenium
        run: |
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          options = Options()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=options)
          # Selenium 스텝 내 run 부분 수정
          driver.get('https://guardian-verifier.streamlit.app/')
          import time
          time.sleep(3)  # 로드 대기
          try:
              # Wake 버튼 클릭 (Streamlit rerun 버튼 클래스)
              rerun_btn = driver.find_element(By.CSS_SELECTOR, '[data-testid="stAppViewContainer"] button, [alt*="rerun"], button:contains("Rerun")')
              rerun_btn.click()
              print("Wake-up button clicked!")
          except:
              print("Button not found, page loaded.")
          driver.quit()

