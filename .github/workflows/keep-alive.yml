name: Keep Guardian Verifier Awake

on:
  schedule:
    - cron: '0 */4 * * *'  # UTC, KST 오후 1시/5시/9시/1시 등
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Selenium
        run: pip install selenium
      - name: Wake app with Selenium
        run: |
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          options = Options()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=options)
          driver.get('https://guardian-verifier.streamlit.app/')
          # 앱 깨우기 위해 버튼/위젯 클릭 (앱 구조에 맞게 조정)
          try:
              button = driver.find_element(By.TAG_NAME, 'button')  # 또는 st.button 셀렉터
              button.click()
          except:
              pass  # 페이지 로드만으로도 OK
          driver.quit()
